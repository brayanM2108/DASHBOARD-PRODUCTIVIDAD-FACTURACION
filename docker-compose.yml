
services:

  mariadb:
    image: mariadb:11
    container_name: dashboard_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dashboard_backend
    restart: always
    environment:
      APP_NAME: ${APP_NAME}
      API_PREFIX: ${API_PREFIX}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS}
      ELECTRONIC_BILLING_PARQUET: ${ELECTRONIC_BILLING_PARQUET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - parquet_data:/app/backend/persisted_data
      - uploads_data:/app/backend/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - dashboard_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dashboard_frontend
    restart: always
    environment:
      API_BASE: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dashboard_network

  nginx:
    image: nginx:alpine
    container_name: dashboard_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - dashboard_network

volumes:
  mariadb_data:
  parquet_data:
  uploads_data:

networks:
  dashboard_network:
